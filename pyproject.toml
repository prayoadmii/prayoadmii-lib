[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "prayoadmii-lib"
version = "0.1.0"
description = "PrayoadMii Python Library"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "colorama"
]
license = {text = "MIT"}
authors = [
    {name = "PrayoadMii"}
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]